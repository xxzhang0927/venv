name: sync

on:
  workflow_dispatch: {}

jobs:
  docker_to_alihz:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - src: "alpine/k8s:1.30.3"
            dst: "acr-maas-bj-registry.cn-beijing.cr.aliyuncs.com/maas/bitnami/k8s:1.30.3"
          - src: "curlimages/curl:8.9.1"
            dst: "acr-maas-bj-registry.cn-beijing.cr.aliyuncs.com/maas/curlimages/curl:8.9.1"
    steps:
      - name: Sync Docker Images
        run: |
          #!/usr/bin/env bash

          set -euxo pipefail

          sync_image() {
              local src_img=$1
              local dst_img=$2

              echo "Copying from source to destination..."
              skopeo copy --all docker://"${src_img}" docker://"${dst_img}" \
                  --dest-creds=${{ secrets.ALIYUN_USERNAME }}:${{ secrets.ALIYUN_PASSWORD }}
          }

          sync_image "${{ matrix.src }}" "${{ matrix.dst }}"
